{% extends "mainapp/base.html" %}

{% block content %}

<p>Topics : {{ topic }}</p>

<ul>
    {% for entry in entries %}
    <p>{{ entry.text }}</p>
    <p>{{ entry.date_added }}</p>
    <p>
        <a href="{% url 'MainApp:edit_entry' entry.id %}">Edit Entry</a>
    </p>
    {% empty %}
        <li>No entries have been added yet.</li>
    {% endfor %}
</ul>

<a href="{% url 'MainApp:new_entry' topic.id %}">Add a new entry</a>

{% endblock content %}
