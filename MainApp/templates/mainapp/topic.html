{% extends "mainapp/base.html" %}

{% block content %}

<h1>{{ topic }}</h1>

<a class="btn btn-primary mb-3" href="{% url 'MainApp:new_entry' topic.id %}">Add a new entry</a>

{% for entry in entries %}
    <!-- Each entry is shown as a Bootstrap "card" -->
    <div class="card mb-3">
        <div class="card-header">
            {{ entry.date_added }}
            <a class="float-end" href="{% url 'MainApp:edit_entry' entry.id %}">Edit entry</a>
        </div>
        <div class="card-body">
            <p class="card-text">{{ entry.text|linebreaks }}</p>
        </div>
    </div>
{% empty %}
    <p>No entries have been added yet.</p>
{% endfor %}

{% endblock content %}
