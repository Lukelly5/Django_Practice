{% extends "mainapp/base.html" %}
{% load django_bootstrap5 %}

{% block content %}

<h1>Add a new topic</h1>

<form action="{% url 'MainApp:new_topic' %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button type="submit" class="btn btn-primary">Add Topic</button>
</form>

{% endblock content %}
