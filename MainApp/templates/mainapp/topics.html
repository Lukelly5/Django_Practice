{% extends "mainapp/base.html" %}

{% block content %}

<h1>Topics</h1>

<ul class="list-group mb-3">
    {% for topic in topics %}
        <li class="list-group-item">
            <a href="{% url 'MainApp:topic' topic.id %}">{{ topic }}</a>
        </li>
    {% empty %}
        <li class="list-group-item">No topics have been added yet.</li>
    {% endfor %}
</ul>

<a class="btn btn-primary" href="{% url 'MainApp:new_topic' %}">Add a new topic</a>

{% endblock content %}
