<a href="{% url 'MainApp:index' %}">Learning Log</a>


{%  if user.is_authenticated %}
    <p>Hello {{ user.username }}</p>

    <!-- Logging out has to be a POST request in newer versions of Django -->
    <form action="{% url 'users:logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>

    <p>
    <a href="{% url 'MainApp:topics' %}">Topics</a>
    </p>

{% else %}
    <p><a href="{% url 'users:login' %}">Login</a></p>
    <p><a href="{% url 'users:register' %}">Register</a></p>

{% endif %}



{% block content %}

{% endblock content %}
