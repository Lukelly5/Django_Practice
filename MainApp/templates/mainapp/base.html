{% load django_bootstrap5 %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Learning Log</title>

    <!-- These two tags load Bootstrap's CSS and JavaScript -->
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
<body>

    <!-- Navigation bar at the top of every page -->
    <nav class="navbar navbar-expand-md navbar-light bg-light border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'MainApp:index' %}">Learning Log</a>

            <!-- This button only shows on small screens to open/close the menu -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <!-- Links on the left -->
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'MainApp:topics' %}">Topics</a>
                    </li>
                </ul>

                <!-- Account links on the right -->
                <ul class="navbar-nav">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <span class="navbar-text me-2">Hello, {{ user.username }}</span>
                        </li>
                        <li class="nav-item">
                            <!-- Logging out has to be a POST request in newer versions of Django -->
                            <form action="{% url 'users:logout' %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'users:register' %}">Register</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'users:login' %}">Login</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Each page's content goes inside this container -->
    <main class="container">
        {% block content %}{% endblock content %}
    </main>

</body>
</html>
