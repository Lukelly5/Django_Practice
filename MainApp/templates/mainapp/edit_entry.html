{% extends "mainapp/base.html" %}
{% load django_bootstrap5 %}

{% block content %}

<h1>Edit entry</h1>

<form action="{% url 'MainApp:edit_entry' entry.id %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>

{% endblock content %}
